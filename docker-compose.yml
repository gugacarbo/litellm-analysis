services:
  postgres:
    image: postgres:16-alpine
    container_name: lite-llm-analytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-llmproxy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dbpassword9090}
      POSTGRES_DB: ${DB_NAME:-model_proxy}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
