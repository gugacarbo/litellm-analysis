packages:
  - "apps/*"
  - "services/*-service"
  - "services/agent-plugins"
  - "packages/*"
  - "repositories/*"
  - "scripts"

overrides:
  "@assistant-ui/core": "0.2.17"
  "@assistant-ui/store": "0.2.18"
  "@assistant-ui/tap": "0.9.2"

catalog:
  "@biomejs/biome": ^2.4.13
  typescript: ^6.0.3
  vitest: ^4.1.5
  drizzle-orm: ^0.38.0
  dotenv: ^17.4.2
  express: ^4.21.0
  "@types/express": ^5.0.0
  tsx: ^4.21.0
  "@types/node": ^25.6.0
  zod: ^4.4.1
  vite: ^8.0.10

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: set this to true or false
  better-sqlite3: true
  esbuild: true
  msw: true
  prisma: true
